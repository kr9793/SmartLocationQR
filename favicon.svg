<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#05070d"/>
  
  <!-- Network Lines -->
  <path d="M32 20 L44 32 L32 44 L20 32 Z" fill="none" stroke="url(#cyan-glow)" stroke-width="3" opacity="0.7"/>
  <path d="M16 16 L32 20 L48 16" fill="none" stroke="url(#purple-glow)" stroke-width="2" opacity="0.6"/>
  <path d="M16 48 L32 44 L48 48" fill="none" stroke="url(#purple-glow)" stroke-width="2" opacity="0.6"/>
  
  <path d="M32 20 L32 44" fill="none" stroke="url(#cyan-glow)" stroke-width="3"/>
  <path d="M20 32 L44 32" fill="none" stroke="url(#cyan-glow)" stroke-width="3"/>
  
  <!-- Outer Nodes -->
  <circle cx="16" cy="16" r="3" fill="#a855f7"/>
  <circle cx="48" cy="16" r="3" fill="#a855f7"/>
  <circle cx="16" cy="48" r="3" fill="#a855f7"/>
  <circle cx="48" cy="48" r="3" fill="#a855f7"/>

  <!-- Inner Nodes -->
  <circle cx="32" cy="20" r="4" fill="#22d3ee"/>
  <circle cx="32" cy="44" r="4" fill="#22d3ee"/>
  <circle cx="20" cy="32" r="4" fill="#22d3ee"/>
  <circle cx="44" cy="32" r="4" fill="#22d3ee"/>
  
  <!-- Core Node -->
  <circle cx="32" cy="32" r="5.5" fill="#a855f7"/>
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>
